  <!-- ============ FLOATING PARTICLES ============ -->
  <g>
    <circle cx="150" cy="180" r="1" fill="#58a6ff" opacity="0.5">
      <animate attributeName="cy" values="180;120;180" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="160" r="1" fill="#3fb950" opacity="0.5">
      <animate attributeName="cy" values="160;100;160" dur="7s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="170" r="1" fill="#58a6ff" opacity="0.5">
      <animate attributeName="cy" values="170;110;170" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="150" r="1" fill="#f0883e" opacity="0.5">
      <animate attributeName="cy" values="150;90;150" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ NAME / TAGLINE ============ -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="450" y="285" font-size="18" fill="#e6edf3" letter-spacing="6">
      SANJIB BAYEN
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
    </text>
    <!-- <text x="450" y="55" font-size="10" fill="#8b949e" letter-spacing="2">
      BETWEEN TWO STATES
    </text> -->
  </g>

  <!-- ============ BOTTOM STATUS BAR ============ -->
  <!-- <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#8b949e" opacity="0.7">
    <text x="20" y="290">[ ai · ml ]</text>
    <text x="140" y="290">[ quantum ]</text>
    <text x="260" y="290">[ mathematics ]</text>
    <text x="420" y="290">[ coffee-driven ]</text>
    <text x="600" y="290">[ minimal ]</text>
    <text x="740" y="290">[ v.2026 ]</text>
  </g> -->

  <!-- Blinking cursor bottom right -->
  <rect x="878" y="282" width="6" height="10" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

</svg>