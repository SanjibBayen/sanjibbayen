    <circle cx="40" cy="30" r="3" fill="#3fb950">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle> -->
    <!-- Layer 3 -->
    <!-- <circle cx="80" cy="20" r="3" fill="#f0883e">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle> -->
    <!-- Connections -->
    <!-- <g stroke="#30363d" stroke-width="0.8">
      <line x1="0" y1="0" x2="40" y2="10"/><line x1="0" y1="0" x2="40" y2="30"/>
      <line x1="0" y1="20" x2="40" y2="10"/><line x1="0" y1="20" x2="40" y2="30"/>
      <line x1="0" y1="40" x2="40" y2="10"/><line x1="0" y1="40" x2="40" y2="30"/>
