  <!-- ============ WAVE FUNCTION GRAPH (right) ============ -->
  <!-- <g transform="translate(720, 200)" opacity="0.6">
    <line x1="0" y1="20" x2="80" y2="20" stroke="#30363d" stroke-width="0.8"/>
    <path d="M 0 20 Q 10 5 20 20 T 40 20 T 60 20 T 80 20" fill="none" stroke="#58a6ff" stroke-width="1.5">
      <animate attributeName="d"
        values="M 0 20 Q 10 5 20 20 T 40 20 T 60 20 T 80 20;
                M 0 20 Q 10 35 20 20 T 40 20 T 60 20 T 80 20;
